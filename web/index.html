<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Set here as well as by the engine: without it the document below
       renders at the browser's default 980px layout until Flutter boots. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ikigai - discover and track anime and manga">
  <meta name="theme-color" content="#0E7C6B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ikigai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon: vector logo (crisp) + PNG fallback.
       The ?v= suffix busts the browser's favicon cache: bump it whenever
       the logo files change, otherwise browsers keep showing the old icon. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="alternate icon" type="image/png" sizes="48x48" href="favicon.png?v=2"/>

  <title>Ikigai — Discover & Track Anime & Manga</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* No splash screen: nothing is drawn between the first paint and
       Flutter's first frame. The background colour below is applied by CSS
       in <head>, before <body> is parsed, so the browser never flashes white
       — it just shows the app's own background until Flutter takes over. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0B1212;
    }
    /* Invisible boot layer. It renders nothing while the engine starts, and
       only becomes visible if start-up actually fails — so a broken build
       explains itself instead of leaving a blank page, without ever showing
       a loader. `pointer-events: none` keeps it from swallowing clicks if
       the first frame is late. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
      z-index: 2147483647;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot .err {
      display: none;
      font-size: 13px;
      max-width: 560px;
      color: #E8F0ED;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      padding: 12px 14px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="boot"><div class="err" id="boot-err"></div></div>
  <script>
    // Report start-up failures instead of failing silently. Registered before
    // flutter_bootstrap.js loads (an `async` script can start executing while
    // the rest of this document is still being parsed).
    (function () {
      var errBox = document.getElementById('boot-err');
      function show(text) {
        if (!errBox) return;
        errBox.style.display = 'block';
        errBox.textContent += (errBox.textContent ? '\n\n' : '') + text;
      }
      window.addEventListener('error', function (e) {
        if (e && e.message) show('Error: ' + e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('Unhandled error: ' + ((e && e.reason && (e.reason.message || e.reason)) || 'unknown'));
      });
      // If flutter_bootstrap.js itself 404s (wrong --base-href), the
      // script onerror below fires with a hint.
      window.__bootFailed = function () {
        show('Could not load flutter_bootstrap.js. The app was likely built with the wrong --base-href.\n' +
             'For GitHub Pages project sites rebuild with --base-href="/Ikigai-Project/" (match the repo name and keep both slashes).');
      };
      // If Flutter never renders, say so rather than leaving a blank page.
      setTimeout(function () {
        if (document.getElementById('boot')) {
          show('The app is taking unusually long to start. Check your connection, ' +
               'or open the DevTools Console for details.');
        }
      }, 30000);

      // Drop the boot layer as soon as Flutter paints its first frame. The
      // element is invisible anyway, so there is never a visual pop.
      window.addEventListener('flutter-first-frame', function () {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="window.__bootFailed && window.__bootFailed()"></script>
</body>
</html>

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Guards the auth/session regressions (browser refresh, rate-limited
      # validation, stale profile snapshot) before anything is deployed.
      - run: flutter test

      # Project sites live under /<repo>/, so the base href must match the
      # repo name exactly (including case). Using the event repo name keeps
      # forks working without editing this file. Keep both slashes.
      - run: >
          flutter build web --release
          --base-href="/${{ github.event.repository.name }}/"

      # GitHub Pages (Jekyll) ignores files starting with `_` without this,
      # which breaks the Flutter bundle (white screen).
      - run: touch build/web/.nojekyll

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so
      # deep links like /<repo>/anime boot the app instead of 404ing.
      # Copy AFTER build so the base href matches index.html exactly.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4